name: Build ClipForge APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p ../dist
          for f in app/build/outputs/apk/release/*.apk; do
            n=$(basename "$f" | sed -e 's/^app-/ClipForge-/' -e 's/-release//')
            cp "$f" "../dist/$n"
          done
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-apks
          path: dist/*.apk

      - name: Publish to the "ClipForge latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: clipforge-latest
          name: ClipForge (latest build)
          prerelease: true
          make_latest: false
          body: |
            Built from `${{ github.ref_name }}` at ${{ github.sha }}.

            **Which file?** Most phones: `ClipForge-arm64-v8a.apk`. Not sure: `ClipForge-universal.apk` (bigger, works everywhere).

            Open the file on your phone and allow "Install unknown apps" when asked.
          files: dist/*.apk
